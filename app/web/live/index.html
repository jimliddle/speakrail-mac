<!doctype html>
<!-- Modified by Jim Liddle, 2026-10-09: show the Mac trial's disabled web search. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speakrail</title>
<link rel="stylesheet" href="static/live.css?v=activity-layout-20261105">
</head>
<body>
<div class="top-bar"></div>

<header class="top">
  <div class="menu">
    <button id="gear" class="chip" aria-haspopup="true" aria-expanded="false">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      Settings
    </button>
    <div id="panel" class="panel" hidden>
      <div class="row"><label for="visualizer">Visualization</label>
        <select id="visualizer"><option value="mesh" selected>Astra</option><option value="blob">Orb (original)</option></select></div>
      <div id="avatar-preview-controls" hidden>
        <div class="row"><label for="avatar-appearance">Appearance</label><select id="avatar-appearance"><option value="portrait">Portrait</option><option value="rig">Plain rig</option></select></div>
        <div class="row"><label for="avatar-pose">Preview pose</label><select id="avatar-pose"><option value="auto">Automatic</option></select></div>
        <div class="row"><label for="speech-pace">Speech pace</label><select id="speech-pace"><option value="0.75">Slow</option><option value="0.85" selected>Relaxed</option><option value="1">Original</option></select></div>
        <div class="row"><button id="avatar-preview" class="chip" aria-pressed="false">Preview speech</button></div>
        <div class="row"><a href="static/assets/mesh-face/portrait-reference.png" target="_blank" rel="noopener">Original portrait</a></div>
      </div>
      <div class="row"><label for="barge">Barge-in</label>
        <select id="barge"><option value="off">off</option><option value="duck" selected>duck (model decides)</option><option value="word">on word</option><option value="head">on speaking class</option></select></div>
      <div class="row"><label for="search">Web search</label>
        <select id="search" disabled><option value="off" selected>off (isolated voice test)</option></select></div>
      <div class="row check"><label><input type="checkbox" id="showlog"> show turn timings</label></div>
    </div>
  </div>
  <div class="brand">Speakrail <span class="dot"></span></div>
  <div class="status">
    <a id="conversation-link" class="chip" hidden>Talk to Astra</a>
    <div id="controls" class="controls" hidden>
      <button id="interrupt" class="chip">Interrupt</button>
      <button id="reconnect" class="chip" title="open a fresh Voxtral session if words stop coming">Reconnect ASR</button>
      <button id="stop" class="chip">Stop</button>
    </div>
    <span id="state" class="pill idle">idle</span>
  </div>
</header>

<div id="cards" class="activity-list" aria-label="Activity and results" hidden></div>
<main>
 <section class="voice-pane" aria-label="Astra">
  <div class="avatar-view">
  <canvas id="blob" role="img" aria-label="Voice activity visualization"></canvas>
  <div id="avatar-notice" class="avatar-notice" role="status" hidden></div>
  <div class="center-ui">
    <button id="go" class="start">Allow microphone &amp; start</button>
  </div>
  </div>
  <div class="subs" aria-label="Conversation captions" tabindex="0">
    <div id="user" class="sub user"></div>
    <div id="bot" class="sub bot"></div>
  </div>
 </section>
 <aside id="result-panel" aria-labelledby="result-title" hidden>
   <div class="result-toolbar"><h2 id="result-title">Details</h2><button id="close-details" class="chip" title="Close details (Escape)" aria-label="Close details">&#215;</button></div>
   <div id="result-content" tabindex="0"></div>
 </aside>
  <div id="log" class="log" hidden></div>
</main>

<script type="importmap">{"imports":{"three":"./static/vendor/three/three.module.js"}}</script>
<script src="static/avatar-motion.js?v=listening-neutral-20261016"></script>
<script src="static/mesh-avatar.js?v=activity-layout-20261105"></script>
<script src="static/lip-sync-timeline.js"></script>
<script src="static/live.js?v=memory-20261106"></script>
</body>
</html>
